<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя библиотека</title>
    <!-- TODO ФАВИКОН: своего значка пока нет. Положите картинку рядом с index.html (например, favicon.png) и уберите знаки комментария со строки ниже -->
    <!-- <link rel="icon" href="favicon.png"> -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="clock-container" id="clock"></div>

<audio id="bg-music" preload="none"></audio>
<button id="play-btn" class="blinking-button">🎵 Включить музыку</button>

<div class="top-container">
    <h1>Моя библиотека</h1>
    <form id="bookForm" class="card">
        <h2>Добавить книгу</h2>
        <label>
            ISBN
            <input type="text" id="isbn" required>
        </label>
        <label>
            Название
            <input type="text" id="title" required>
        </label>
        <label>
            Автор
            <input type="text" id="author" required>
        </label>
        <label>
            Год
            <input type="number" id="year" min="1" max="9999" step="1" required>
        </label>
        <button class="add-btn" type="submit">Добавить книгу</button>
    </form>
</div>

<div class="bottom-container">
    <div class="table-card card">
        <div class="table-scroll">
        <table id="libraryTable" aria-describedby="table-desc">
            <caption id="table-desc" style="display:none;">Список книг</caption>
            <thead>
            <tr>
                <th>№</th>
                <th>ISBN</th>
                <th>Название</th>
                <th>Автор</th>
                <th>Год</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
        </div>
        <div id ="stats">
            <h2>Статистика библиотеки</h2>
            <p>Всего книг: <span id = "totalBooks">0</span></p>
            <p>Средний год издания: <span id = "avgYear">—</span></p>
            <p>Самый ранний год: <span id = "minYear">—</span></p>
            <p>Самый поздний год: <span id = "maxYear">—</span></p>
        </div>
    </div>
</div>

<canvas id="explosion-canvas"></canvas>

<script src="homework.js"></script>
</body>
</html>
